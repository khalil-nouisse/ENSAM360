<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENSAM Meknes - Virtual Tour</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Core 3D library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/107/three.min.js"></script>

    <!-- Photo Sphere Viewer library -->
    <script src="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/photo-sphere-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/photo-sphere-viewer.min.css">
    
    <!-- Markers Plugin for navigation -->
    <script src="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/plugins/markers.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/plugins/markers.min.css">

    <style>
        /* Custom styles for a polished look */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #111827; /* Dark background */
        }
        #viewer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 1.5rem 2rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .location-display {
             background-color: rgba(0, 0, 0, 0.6);
             padding: 0.5rem 1.25rem;
             border-radius: 9999px;
             font-size: 1rem;
             backdrop-filter: blur(5px);
        }
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom marker style */
        .custom-marker {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.7);
            border: 2px solid white;
            color: white;
            font-size: 24px;
            text-align: center;
            line-height: 46px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.8);
        }
        .custom-marker:hover {
            transform: scale(1.2);
            background: rgba(0, 122, 255, 1);
        }
        .psv-tooltip-content {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Header UI -->
    <div class="header">
        <h1>ENSAM Meknes Virtual Tour</h1>
        <div id="current-location" class="location-display">Loading...</div>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Loading Campus...</p>
    </div>
    
    <!-- The container for the 360° viewer -->
    <div id="viewer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loader = document.getElementById('loader');
            const locationDisplay = document.getElementById('current-location');
            
            // --- DATA: Define your campus locations here ---
            // IMPORTANT: Replace the panorama URLs with your own 360° images.
            const campusNodes = [
                {
                    id: 'entrance',
                    name: 'Campus Entrance',
                    // Placeholder image from an external source
                    panorama: 'https://placehold.co/4096x2048/7c90a0/ffffff.png?text=ENSAM+Entrance+360%C2%B0',
                    markers: [
                        {
                            id: 'to-library',
                            nodeId: 'library',
                            tooltip: 'Go to Library',
                            // Position on the sphere: longitude, latitude
                            position: { yaw: '0deg', pitch: '-10deg' },
                        }
                    ]
                },
                {
                    id: 'library',
                    name: 'University Library',
                    // Placeholder image from an external source
                    panorama: 'https://placehold.co/4096x2048/a08c7c/ffffff.png?text=Library+360%C2%B0',
                    markers: [
                        {
                            id: 'to-workshop',
                            nodeId: 'workshop',
                            tooltip: 'Visit Mechanical Workshop',
                            position: { yaw: '90deg', pitch: '-5deg' },
                        },
                        {
                            id: 'to-entrance',
                            nodeId: 'entrance',
                            tooltip: 'Return to Entrance',
                            position: { yaw: '200deg', pitch: '-15deg' },
                        }
                    ]
                },
                {
                    id: 'workshop',
                    name: 'Mechanical Workshop',
                    // Placeholder image from an external source
                    panorama: 'https://placehold.co/4096x2048/334155/ffffff.png?text=Workshop+360%C2%B0',
                    markers: [
                        {
                            id: 'to-library-2',
                            nodeId: 'library',
                            tooltip: 'Back to Library',
                            position: { yaw: '180deg', pitch: '-10deg' },
                        }
                    ]
                }
            ];

            // --- INITIALIZE THE VIEWER ---
            const viewer = new PhotoSphereViewer.Viewer({
                container: document.querySelector('#viewer'),
                loadingImg: 'https://placehold.co/200x200/111827/ffffff.png?text=Loading...',
                touchmoveTwoFingers: true,
                mousewheelCtrlKey: true,
                defaultLong: Math.PI,
                plugins: [
                    [PhotoSphereViewer.MarkersPlugin, {}],
                ]
            });

            const markersPlugin = viewer.getPlugin(PhotoSphereViewer.MarkersPlugin);

            // --- HELPER FUNCTIONS ---
            
            function showLoader() {
                loader.style.display = 'flex';
                viewer.container.style.opacity = '0.5';
            }

            function hideLoader() {
                loader.style.display = 'none';
                viewer.container.style.opacity = '1';
            }

            // Function to load a new location (node)
            function loadNode(nodeId) {
                const node = campusNodes.find(n => n.id === nodeId);
                if (!node) return;

                showLoader();
                locationDisplay.textContent = `Loading: ${node.name}`;
                
                // Set the panorama and markers for the new location
                viewer.setPanorama(node.panorama)
                    .then(() => {
                        markersPlugin.clearMarkers();
                        
                        node.markers.forEach(markerInfo => {
                            markersPlugin.addMarker({
                                id: markerInfo.id,
                                position: markerInfo.position,
                                html: '➡️',
                                anchor: 'center center',
                                size: { width: 50, height: 50 },
                                style: {
                                    fontSize: '24px',
                                    color: 'white',
                                    background: 'rgba(0, 122, 255, 0.7)',
                                    borderRadius: '50%',
                                    border: '2px solid white',
                                    boxShadow: '0 0 15px rgba(0, 122, 255, 0.8)',
                                    cursor: 'pointer',
                                    transition: 'transform 0.2s',
                                },
                                tooltip: markerInfo.tooltip
                            });
                        });
                        
                        locationDisplay.textContent = node.name;
                        hideLoader();
                    })
                    .catch(err => {
                        console.error('Error loading panorama:', err);
                        alert(`Could not load the image for "${node.name}". Please check the URL.`);
                        hideLoader();
                    });
            }

            // --- EVENT LISTENERS ---
            
            // Listen for marker clicks to navigate
            markersPlugin.on('select-marker', (e, marker) => {
                const targetNode = campusNodes.find(n => n.markers.some(m => m.id === marker.id));
                const markerInfo = targetNode.markers.find(m => m.id === marker.id);
                if (markerInfo && markerInfo.nodeId) {
                    loadNode(markerInfo.nodeId);
                }
            });

            // Add hover effects to markers
            markersPlugin.on('over-marker', (e, marker) => {
                marker.element.style.transform = 'scale(1.2)';
            });
            markersPlugin.on('leave-marker', (e, marker) => {
                marker.element.style.transform = 'scale(1)';
            });

            // --- START THE TOUR ---
            // Load the initial location when the app starts
            loadNode('entrance');
        });
    </script>
</body>
</html>
